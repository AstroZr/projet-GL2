aide.singleton.titre=Technique du singleton
aide.singleton.explication=Une zone qui ne comporte qu'une case prend forc\u00e9ment sa valeur cible.
aide.singleton.description=Dans une grille, la r\u00e8gle la plus simple est celle des cages \u00e0 une seule case. Comme il n'y a pas d'op\u00e9ration \u00e0 effectuer, le nombre \u00e0 inscrire est exactement la valeur cible indiqu\u00e9e en haut \u00e0 gauche de la zone. C'est la premi\u00e8re \u00e9tape logique pour compl\u00e9ter une grille ou d\u00e9bloquer une situation difficile.
aide.reste.titre=Technique du reste
aide.reste.explication=Il manque un dernier chiffre \u00e9vident pour compl\u00e9ter cette ligne ou colonne.
aide.reste.description=La r\u00e8gle du jeu interdit de r\u00e9p\u00e9ter un m\u00eame chiffre sur une ligne ou une colonne. Par cons\u00e9quent, si une ligne ou une colonne compte d\u00e9j\u00e0 tous les chiffres sauf un (il ne reste qu'une case vide), on d\u00e9duit le seul chiffre manquant.
aide.reste.position=Ici, la
aide.reste.ligne=ligne
aide.reste.colonne=colonne
aide.reste.numero=est la num\u00e9ro :
aide.uniquecacheeligne.titre=Unique Cach\u00e9 (Ligne)
aide.uniquecacheeligne.explication=Un chiffre obligatoire ne poss\u00e8de qu'une seule position valide sur cette ligne.
aide.uniquecacheeligne.description=Dans une ligne, chaque chiffre doit appara\u00eetre exactement une fois. En observant les autres lignes, colonnes et contraintes des diff\u00e9rentes zones qui intersectent cette ligne, on s'aper\u00e7oit que les cases libres de la ligne ne peuvent pas contenir ce chiffre sans causer d'erreur, \u00e0 l'exception d'une seule : on trouve donc la case pour ce chiffre donn\u00e9.
aide.uniquecacheeligne.position=Examinez la ligne :
aide.uniquecacheecolonne.titre=Unique Cach\u00e9 (Colonne)
aide.uniquecacheecolonne.explication=Un chiffre obligatoire ne poss\u00e8de qu'une seule position valide sur cette colonne.
aide.uniquecacheecolonne.description=Dans une colonne, chaque chiffre appara\u00eet de fa\u00e7on unique. Si l'on \u00e9tudie les autres colonnes, lignes et cages de calcul associ\u00e9es, on remarque que les cases vides de cette colonne, \u00e0 l'exception d'une, sont incapables d'accueillir un certain chiffre. Le vrai emplacement de ce chiffre est d\u00e9voil\u00e9 par \u00e9limination.
aide.uniquecacheecolonne.position=Examinez la colonne :
aide.blocageunique.titre=Blocage Unique
aide.blocageunique.explication=Les contraintes math\u00e9matiques de ce bloc forcent une case \u00e0 prendre une valeur.
aide.blocageunique.description=Cette technique avance s'appuie sur les math\u00e9matiques des zones de calcul. M\u00eame si la zone comporte plusieurs cases libres, on a recens\u00e9 l'ensemble des combinaisons op\u00e9ratoires possibles respectant \u00e0 la fois la valeur cible et les d\u00e9j\u00e0 chiffres inscrits de grille. M\u00eame s'il y a de multiples solutions, l'une des cases prend syst\u00e9matiquement la m\u00eame valeur pour chacune des possibilit\u00e9s : elle assume donc forc\u00e9ment cette valeur d\u00e9ductive.
aide.blocageunique.position=Examinez le bloc contenant la ligne :
aide.candidatunique.titre=Candidat unique
aide.candidatunique.explication=Toutes les autres valeurs test\u00e9es pour cette case ont \u00e9t\u00e9 \u00e9limin\u00e9es.
aide.candidatunique.description=En ciblant une case sp\u00e9cifique, on peut recenser ses possiblilits num\u00e9rales restants. Sous l'application des r\u00e8gles, en \u00e9liminent tous les candidats d\u00e9j\u00e0 pr\u00e9sents sur la ligne et sur la colonne concern\u00e9es, la case n'autorise plus qu'un seul chiffre d'y \u00eatre pos\u00e9 en raison l'extr\u00eame de cet \u00e9tau math\u00e9matique : ce candidat valide est la r\u00e9solution de la case.
aide.candidatunique.colonne=Regardez la colonne :
aide.candidatunique.ligne=Regardez la ligne :
