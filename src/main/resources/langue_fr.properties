# Tutoriel
tuto.continuer=Cliquez pour continuer
tuto.etape0=Bienvenue dans le tutoriel CalcuDoku ! Ce jeu de logique consiste \u00e0 remplir une grille N\u00d7N avec les chiffres de 1 \u00e0 N.
tuto.etape1=R\u00e8gle 1 : chaque chiffre ne doit appara\u00eetre qu'une seule fois par ligne et par colonne. Pas de doublons !
tuto.etape2=R\u00e8gle 2 : la grille est divis\u00e9e en zones. Chaque zone indique une valeur cible et une op\u00e9ration (ex. 4+ = la somme des cases vaut 4).
tuto.etape3=Zone 4+ : cette case et celle du dessous doivent donner 4. La case en dessous vaudra 3. Entrez 1.
tuto.etape4=Compl\u00e9tez la zone 4+. 1 + 3 = 4. Entrez 3.
tuto.etape5=La premi\u00e8re ligne contient d\u00e9j\u00e0 1 et 3. Le seul chiffre manquant est 2. Entrez 2.
tuto.etape6=Zone 5+ : 2 + 3 = 5. Entrez 3.
tuto.etape7=Zone 3+ : cette case et la suivante doivent donner 3. Entrez 1.
tuto.etape8=Zone 3+ : 1 + 2 = 3. Entrez 2.
tuto.etape9=Zone 5+, derni\u00e8re ligne. Entrez 2.
tuto.etape10=Zone 5+ : 2 + 3 = 5. Entrez 3.
tuto.etape11=Zone 1 (op\u00e9ration AUCUNE) : la valeur cible est directement la valeur \u00e0 entrer. Entrez 1.
tuto.etape12=F\u00e9licitations ! Grille compl\u00e8te. Vous \u00eates pr\u00eat \u00e0 jouer !

