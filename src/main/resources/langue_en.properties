# Tutorial
tuto.continuer=Click to continue
tuto.etape0=Welcome to the CalcuDoku tutorial! This logic game consists of filling an NxN grid with digits from 1 to N.
tuto.etape1=Rule 1: each digit must appear only once per row and column. No duplicates!
tuto.etape2=Rule 2: the grid is divided into cages. Each cage shows a target value and an operation (e.g. 4+ means the cells sum to 4).
tuto.etape3=Cage 4+: this cell and the one below must sum to 4. The cell below will be 3. Enter 1.
tuto.etape4=Complete the 4+ cage. 1 + 3 = 4. Enter 3.
tuto.etape5=The first row already has 1 and 3. The only missing digit is 2. Enter 2.
tuto.etape6=Cage 5+: 2 + 3 = 5. Enter 3.
tuto.etape7=Cage 3+: this cell and the next must sum to 3. Enter 1.
tuto.etape8=Cage 3+: 1 + 2 = 3. Enter 2.
tuto.etape9=Cage 5+, bottom row. Enter 2.
tuto.etape10=Cage 5+: 2 + 3 = 5. Enter 3.
tuto.etape11=Cage 1 (no operation): the target value is directly the digit to enter. Enter 1.
tuto.etape12=Congratulations! Grid complete. You are ready to play!

