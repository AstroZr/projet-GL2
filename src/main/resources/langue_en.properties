# Hints
aide.overlay.titre=Hint
aide.overlay.aucune=No hint available right now.
aide.singleton.titre=Singleton technique
aide.singleton.explication=A cage with a single cell must contain its target value.
aide.singleton.description=In a MathDoku grid, the simplest rule applies to cages with only one cell, often called 'singlets'. Since there are no operations to perform with other digits, the number to enter is exactly the target value shown in the top left corner of the cage. This fundamental technique is usually the best starting point for solving a puzzle.
aide.reste.titre=Remaining slot technique
aide.reste.explication=A nearly full row or column where the last empty cell is trivial to deduce.
aide.reste.description=A fundamental rule of this game forbids repeating the same digit in any row or column. Therefore, if a row or column already contains all digits but one (only one empty cell remains), the missing digit can be easily deduced. You simply need to determine which number is not yet present.
aide.reste.position=Here, the
aide.reste.ligne=row
aide.reste.colonne=column
aide.reste.numero=is number:
aide.uniquecacheeligne.titre=Hidden Single (Row)
aide.uniquecacheeligne.explication=A digit has only one valid placement left in this row.
aide.uniquecacheeligne.description=In a given row, every digit must appear exactly once. By observing the other rows, columns, and cage constraints intersecting this row, you can see that all other empty cells in the row cannot contain a specific digit without causing an error. The placement of this digit is 'hidden' but unique: it must be entered in the only cell that can still accept it within that row.
aide.uniquecacheeligne.position=Examine row number:
aide.uniquecacheecolonne.titre=Hidden Single (Column)
aide.uniquecacheecolonne.explication=A digit has only one valid placement left in this column.
aide.uniquecacheecolonne.description=In any given column, each digit must be unique. If we study the other columns, rows, and associated calculation cages, we notice that all the empty cells in this column, except one, are unable to accommodate a certain digit due to game rules. The true location of the digit is thus revealed by elimination: we know exactly where to place it in the column.
aide.uniquecacheecolonne.position=Examine column number:
aide.blocageunique.titre=Unique Block
aide.blocageunique.explication=The mathematical constraints of this cage force a cell to take a specific value.
aide.blocageunique.description=This expert technique relies on the mathematics of calculation cages. Even if the cage has multiple empty cells, we can examine all the possible operator combinations to reach the cage's target. Whichever valid combination is used, one specific cell in the cage must always take the exact same value across all combinations. It is 'blocked' into that value, so we can enter it safely.
aide.blocageunique.position=Examine the block containing row:
aide.candidatunique.titre=Single Candidate 
aide.candidatunique.explication=All other possibilities for this cell have been eliminated.
aide.candidatunique.description=By focusing attention on a specific cell intersecting a row, column, and cage, you can list the possible digits (candidates). The rules of the game require eliminating any candidates already present in the same row or column. When every possible option has been eliminated except one, the choice is clear: it is the sole viable candidate for this exact cell.
aide.candidatunique.colonne=Look at the column :
aide.candidatunique.ligne=Look at the line :
aide.intrazone.titre=Intra Zone
aide.intrazone.description=When a block has a weird shape, it's possible to deduce a number.
aide.intrazone.zone=The value of the block is:

